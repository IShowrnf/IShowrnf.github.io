<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether Legit v2.6</title><style>body{background:#101012;color:#f5f0e6;font:16px system-ui;display:grid;place-items:center;min-height:100vh;margin:0}main{text-align:center;padding:24px;max-width:500px}h1,a{color:#eac375}progress{width:100%;accent-color:#eac375}button{padding:12px 20px;background:#eac375;color:#15120d;border:0;border-radius:8px;font-weight:700;cursor:pointer}</style></head><body><main><h1>♛ Aether Legit</h1><p id="status" role="status">Loading v2.6 Builders…</p><progress id="progress" max="2" value="0"></progress><p><a href="aether-legit.html">Open previous build</a> · <a href="../">Home</a></p><button id="save" hidden>Save offline HTML</button></main><script>
(async()=>{const status=document.getElementById('status'),progress=document.getElementById('progress'),save=document.getElementById('save');try{let count=0;const sizes=[17404877,17404878];const parts=await Promise.all(sizes.map(async(size,i)=>{const r=await fetch('aether-v26-part'+(i+1)+'.bin',{cache:'no-cache'});if(!r.ok)throw Error('Missing game part '+(i+1));const b=await r.arrayBuffer();if(b.byteLength!==size)throw Error('Incorrect size for part '+(i+1));progress.value=++count;return b}));const bytes=new Uint8Array(34809755);bytes.set(new Uint8Array(parts[0]));bytes.set(new Uint8Array(parts[1]),sizes[0]);const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),v=>v.toString(16).padStart(2,'0')).join('');if(digest!=='e228695a3994b6042097577e43f11c586b53b25248d20f64e53ef03094142897')throw Error('Game checksum mismatch');const blob=new Blob([bytes],{type:'text/html;charset=utf-8'});if(new URLSearchParams(location.search).has('download')){status.textContent='Verified — ready to save.';save.hidden=false;save.onclick=()=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Aether_Legit_1.12.2_v2.6_Builders.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};return}const html=new TextDecoder('utf-8',{fatal:true}).decode(bytes);document.open();document.write(html);document.close()}catch(e){status.textContent='v2.6 unavailable: '+e.message+'. Upload both game parts or open the previous build.';progress.hidden=true}})();</script></body></html>

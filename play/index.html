<!DOCTYPE html>
<html lang="en" data-theme="femboy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NullClient — playing now</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='1em' font-size='90'%3E%F0%9F%92%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/themes.css">
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
		background: var(--bg); color: var(--text); }
	.topbar {
		display: flex; align-items: center; gap: 12px;
		padding: 10px 14px;
		background: var(--panel);
		border-bottom: 1px solid var(--panel-border);
		box-shadow: var(--panel-shadow);
	}
	.topbar .who { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14px; }
	.topbar .chip { color: var(--text-dim); font-size: 12.5px; }
	.spacer { flex: 1; }
	.tbtn {
		border: 1px solid var(--panel-border); background: var(--chip-bg); color: var(--text);
		padding: 7px 13px; border-radius: 10px; font-size: 13px; cursor: pointer; text-decoration: none; font-weight: 600;
		transition: filter .15s ease, transform .15s ease;
	}
	.tbtn:hover { filter: brightness(1.08); transform: translateY(-1px); }
	.tbtn.primary { background: var(--btn-primary-bg); color: var(--btn-primary-text); border-color: transparent; }
	iframe { flex: 1; border: 0; width: 100%; background: #000; }
	.hint { color: var(--text-faint); font-size: 11.5px; }
	iframe:fullscreen { border-radius: 0; }
</style>
<script src="../js/theme.js" defer></script>
</head>
<body>

<div class="topbar">
	<div class="who">
		<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round">
			<path d="M4 14a8 8 0 0 1 16 0v3h-3.4l-.6-2H8l-.6 2H4z"/>
			<path d="M12 3v4" stroke-linecap="round"/>
		</svg>
		NullClient <span class="chip">· aether 1.12 · playing now ✿</span>
	</div>
	<span class="spacer"></span>
	<span class="hint">world saves in this browser tab</span>
	<button class="tbtn" id="fs">⛶ fullscreen</button>
	<a class="tbtn" href="../">← back</a>
</div>

<iframe id="game" src="../game/aether.html" title="NullClient — Aether 1.12" allow="fullscreen; gamepad; autoplay" allowfullscreen></iframe>

<script>
	var frame = document.getElementById("game");
	document.getElementById("fs").addEventListener("click", function () {
		if (document.fullscreenElement) {
			document.exitFullscreen();
		} else if (frame.requestFullscreen) {
			frame.requestFullscreen();
		}
	});
</script>

</body>
</html>
